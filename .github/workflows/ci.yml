name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # cargo-smysl-git's tests read commits from this repository's own history.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Includes tests that go through real `cargo smysl`, not only the binary.
      - run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86
      - uses: Swatinem/rust-cache@v2
      # The shipped crates only: cargo-smysl-eval is development tooling (publish = false), and its
      # model client (ureq) pulls an icu/yoke chain that needs a newer rustc than this floor.
      - run: cargo build -p cargo-smysl -p cargo-smysl-corpus -p cargo-smysl-facts -p cargo-smysl-git --locked

  # The objective: an external cargo subcommand, installed by `cargo install`, working under cargo.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --path crates/cargo-smysl --locked --root "${{ runner.temp }}/root"
      - name: cargo smysl works under cargo
        shell: bash
        run: |
          export PATH="${{ runner.temp }}/root/bin:$PATH"
          cargo smysl --version
          cargo smysl --help
          cargo smysl doctor

  # The corpus, checked with the deterministic commands only. No model runs here: `check` is advisory
  # (measured at about one correct flag in ten on a free local model), so gating a build on it would
  # teach people to ignore it. What is gated is what is provable — the corpus loads, the documents
  # rebuild the store, and staleness can be computed.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --path crates/cargo-smysl --locked --root "${{ runner.temp }}/root"
      - name: what the tool sees
        shell: bash
        run: |
          export PATH="${{ runner.temp }}/root/bin:$PATH"
          cargo smysl doctor
      - name: the corpus loads, and staleness is computable
        shell: bash
        run: |
          export PATH="${{ runner.temp }}/root/bin:$PATH"
          if [ ! -d .smysl/commits ]; then
            echo "no corpus tracked in this repository; nothing to check"
            exit 0
          fi
          cargo smysl stale --json > stale.json
          python3 - <<'EOF'
          import json
          rows = json.load(open("stale.json"))
          moved = [r for r in rows if r["items"]]
          print(f"{len(moved)} of {len(rows)} recorded commit(s) rest on code that has moved")
          for r in moved:
              print(f"  {r['commit']}: {r['changed']} changed, {r['gone']} gone")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stale
          path: stale.json
          if-no-files-found: ignore

  # The objective: self-contained. smysl is linked with the model-free `stage` feature only, and the
  # model-free crates never pull in the model-facing ones.
  self-contained:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # D18: the default install speaks plain HTTP to a local model, so it needs no TLS stack at all.
      # `--features hosted` is the opt-in for a paid provider, and may carry one.
      - name: no provider layer or network stack in the default binary
        run: |
          if cargo tree -p cargo-smysl -e normal --locked | grep -E "smysl-provider|ureq|tokio|rustls"; then
            echo "cargo-smysl must stay self-contained and model-free at the smysl layer"; exit 1
          fi
      - name: corpus and facts stay model-free
        run: |
          for crate in cargo-smysl-corpus cargo-smysl-facts; do
            if cargo tree -p "$crate" -e normal --locked | grep -E "cargo-smysl-(extract|verdict|evidence)"; then
              echo "$crate must not depend on model-facing crates"; exit 1
            fi
          done
