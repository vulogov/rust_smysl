# S0 label — smysl 69ea5c0
# Why this commit is in the set: format migration: ordering constraints between readers and writers
# Label from the message AND the diff: git -C eval/.repos/smysl show 69ea5c05d85933ca248ea9ca78669f8a76e2ed7e
# Definitions and boundary cases: eval/README.md. Label blind: do not open extractions first.
#
# Message:
#   Format migration steps 1 and 2: readers accept smysl/1.0, writer stops relabelling
#   
#   §0.1 of ROAD_TO_1.0.md, the first two of its four steps. Step 3 — making
#   smysl/1.0 what new documents declare — waits for 0.14 to be published, because
#   §8.2 requires a reader to refuse a version absent from its list: flip the writer
#   before the field has a reader for it and every other implementation rejects the
#   output.
#   
#   FORMAT_VERSIONS_SUPPORTED is ["smysl/0.1", "smysl/1.0"] and nothing writes the
#   second yet. FORMAT_VERSION_DEFAULT is new and separate from
#   FORMAT_VERSIONS_SUPPORTED[0], because the two stopped meaning the same thing the
#   moment the list grew: one is what we emit, the other is what we accept. Step 3
#   changes the first and not the second.
#   
#   The tripwire fired, which is what it was for. versioning.rs was written in 0.10
#   to fail the moment the list grew, and it did — along with two sibling tests that
#   had picked smysl/1.0 as their example of an *unknown* version, and a fourth in
#   smysl-core's own unit tests. All four are now driven by the list rather than by a
#   literal, so they grow with it instead of failing on it.
#   
#   The defect the tripwire was guarding is fixed rather than worked around.
#   ParseOutcome carries the version the document declared; WriteContext carries what
#   the header will say; write_surface emits that instead of a build-time constant.
#   `smysl fmt` — the round trip a user runs on purpose — passes one to the other.
#   What stands in versioning.rs now is the property the count was standing in for: a
#   document declaring either supported version comes back declaring the one it
#   declared. Verified by restoring the old writer and watching it report "a document
#   declaring `smysl/1.0` was rewritten as: @doc smysl/0.1".
#   
#   The plan was wrong about the other three implementations. It said the same list
#   grows in python/, nodejs/ and go/. There is no such list: all three read CBOR
#   only, the wire carries no version string, and go/conformance_test.go says so
#   outright — "surface syntax is not decoded here". Only a surface parser ever sees
#   a @doc header. §8.5 now records that, and the migration is smaller than it looked.
#   
#   And it is not a breaking change, which is §1.1 paying out: ParseOutcome and
#   WriteContext are both #[non_exhaustive], so each could gain a field without a
#   major bump and write_surface's signature never moved. make semver is 12/12 clean,
#   so this belongs in a quiet cycle after all — the thing Phase 3 was worried about
#   turns out not to threaten it.
#   
#   api-check caught the surface growing, which is the gate S5 added doing exactly
#   its job: an addition is nobody's break, so semver would not have said a word.
#   FORMAT_VERSION_DEFAULT is exported from the facade too — an embedder writing
#   surface documents needs to know what to declare.
#   
#   §8.5 and §8.6 of the format spec updated: the trap is recorded as fixed, and 8.6
#   now says what smysl/1.0 will mean, which is that the format is settled rather
#   than changed.
#   
#   make ci green; make semver 12/12.
