# Definitions and boundary cases: eval/README.md. Label blind: do not open extractions first.
#
# Message:
#   Fix the fuzz build 1.1 broke, and make `make ci` able to see it
#   
#   CI went red on the fuzz job after 312e37d. fuzz/fuzz_targets/pack_exact.rs
#   builds a `Constraints` literal, and §1.1 made that type `#[non_exhaustive]`.
#   Built from its default and adjusted now, like the other four call sites.
#   
#   The interesting half is why nothing local caught it. `fuzz/` is its own
#   workspace, so `cargo check --workspace` from the root never compiles it and
#   `make ci` structurally could not have seen this. Every local check passed and
#   the push was verified twice.
#   
#   That is the same defect shape as the rest of this cycle — a check that passes
#   without covering what it claims — so the fix is a gate, not just a patch.
#   `make fuzz-build` compiles the fuzz targets without running them and is now part
#   of `make ci`. Compiling costs a second; *running* the fuzzers needs nightly and a
#   minute per target, which is why that stays its own job.
#   
#   Verified by re-introducing the break and watching the gate fail, which caught a
#   second defect in the gate itself: the recipe piped cargo through `tail -5`, and
#   a pipeline's exit status is the last command's, so it printed the error and
#   returned 0. A gate that reports a failure and passes anyway is precisely what
#   this file keeps finding elsewhere. Unpiped, it exits 2 with the break present
#   and 0 without.
#   
#   The Makefile's own header says a local check that differs from CI is a check
#   that lets you push red. It did.
#
