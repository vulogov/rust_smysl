# Definitions and boundary cases: eval/README.md. Label blind: do not open extractions first.
#
# Message:
#   P1: -D warnings reaches every combination, and six items were hiding
#   
#   verify.yml set it and features.yml did not, while the two exist to
#   catch the same defect: a #[cfg] that does not match what the code
#   needs. This workflow has caught six of those by build failure and let
#   the identical defect through as a warning nobody read.
#   
#   Six items existed under some features without saying so. RatInterval
#   is parse_redshift's return type and nothing else's, so cosmo.
#   qualified::Kind is read once by to-civil, so civil. Rounding is
#   to-civil's default when --round is absent. parse_form and codec::Form
#   belong to run_now, which needs civil and std. And years_quantity is
#   called by events for a window's width and by cosmo for an enclosure's
#   ends, so any(events, cosmo) — a shape no single feature name could
#   express, which is why it had no attribute rather than a wrong one.
#   
#   Every fix is an attribute, not a suppression.
#   
#   The five libraries were already clean; all of it was in the binary
#   crate, in eight of the nineteen builds, and it surfaced one layer at a
#   time because a lib that fails to compile never lets the binary's own
#   warnings appear.
#   
#   The refused job inherits the flag and its checks still hold — the
#   backend guard is still the first error line, which is the property that
#   job defends and the one -D warnings could most easily have broken.
#   
#   Also: sign-release said "no release, or gh cannot see it" and left the
#   reader to guess which. The first person to hit it was unauthenticated,
#   not missing a release. Two conditions with different remedies now get
#   two messages, which is the shape D-A24 catalogued.
