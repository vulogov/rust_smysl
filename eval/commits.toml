# S0 — the labelled evaluation set (docs/implementation-plan.md §4).
#
# 20 commits across three repositories with different commit-message styles. "studied" commits were
# used in the research, so research extractions exist for them and can be scored as soon as they
# are labelled. "new" commits have never been extracted.

[repos.smysl]
url   = "https://github.com/vulogov/smysl"
style = "essay: long messages that state reasons, alternatives and checks"

[repos.ucal]
url   = "https://github.com/vulogov/ucal"
style = "essay: same author as smysl"

[repos.clap]
url   = "https://github.com/clap-rs/clap"
style = "ordinary: conventional-commit one-liners, reasons mostly implicit in the diff"

