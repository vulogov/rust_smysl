[package]
name                   = "cargo-smysl-verdict"
description            = "cargo-smysl: verdict stage"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"

[features]
default = []
# Hosted providers need TLS; the default build has no network stack at all, which is what the
# self-contained objective and the CI rule mean (D18).
hosted = ["cargo-smysl-extract/hosted"]

[dependencies]
cargo-smysl-corpus = { workspace = true }
cargo-smysl-facts  = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
cargo-smysl-extract = { workspace = true }
imara-diff         = "0.2"
smysl = { workspace = true, features = ["stage"] }

[dev-dependencies]
cargo-smysl-corpus.workspace = true
serde_json.workspace = true
