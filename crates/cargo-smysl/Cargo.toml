[package]
name                   = "cargo-smysl"
description            = "Cargo subcommand that records why Rust code changed — decisions, prerequisites, evidence — as a smysl corpus"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
# Its own, rather than the workspace's: this is the crate people install, and it is found by searching
# for a cargo subcommand.
keywords               = ["cargo-subcommand", "rationale", "smysl", "provenance", "decisions"]
categories             = ["development-tools::cargo-plugins"]
# A published package cannot reach outside itself, so the crate carries a short README of its own and
# the full one stays in the repository.
readme                 = "README.md"

# Cargo finds external subcommands by binary name: `cargo smysl` runs `cargo-smysl smysl …`.
[[bin]]
name = "cargo-smysl"
path = "src/main.rs"

[dependencies]
cargo-smysl-corpus   = { workspace = true }
cargo-smysl-facts    = { workspace = true }
cargo-smysl-extract  = { workspace = true }
cargo-smysl-git      = { workspace = true }
cargo-smysl-verdict  = { workspace = true }
serde_json           = { workspace = true }
cargo-smysl-evidence = { workspace = true }
cargo-smysl-bench    = { workspace = true }
# Label and adjudication files are TOML: a person edits them by hand, so they are not JSON.
toml                 = "1"
smysl                = { workspace = true }
clap                 = { workspace = true }
cargo_metadata       = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
